name: Python CI Pipeline - Sistem Perpustakaan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Mengambil Kode dari Repositori (Checkout)
        uses: actions/checkout@v4

      - name: 2. Menyiapkan Lingkungan Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Menginstal Dependensi Sistem & Python
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Pengecekan Kualitas Kode (Linter flake8)
        run: |
          flake8 models/ controllers/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 5. Menjalankan Automated Unit Testing (Pytest)
        run: |
          PYTHONPATH=. xvfb-run python -m pytest tests/ -v